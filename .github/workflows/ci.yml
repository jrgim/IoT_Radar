name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest

      - name: Ejecutar tests
        run: pytest

  addon-lint:
    name: Validar add-on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar config.yaml con el linter de add-ons de Home Assistant
        uses: frenck/action-addon-linter@v2
        with:
          path: "."
