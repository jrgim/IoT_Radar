name: "IoT Radar"
version: "1.0.0"
slug: "iot_radar"
description: "Monitor de seguridad IoT: MQTT, Zigbee y LAN en tiempo real"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
host_network: true
privileged:
  - NET_ADMIN
  - NET_RAW
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8765
ingress_entry: "/"
panel_title: "IoT Radar"
panel_icon: "mdi:shield-lock"
init: false
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  z2m_topic_prefix: "zigbee2mqtt"
  scan_interval_minutes: 60
  nvd_api_key: ""
  alert_notify_service: "notify"
  known_devices: []
schema:
  mqtt_host: str?
  mqtt_port: int?
  mqtt_user: str?
  mqtt_password: password?
  z2m_topic_prefix: str?
  scan_interval_minutes: int?
  nvd_api_key: password?
  alert_notify_service: str?
  known_devices:
    - mac: str?
      name: str?
      trusted: bool?
